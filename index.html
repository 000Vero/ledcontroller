<!DOCTYPE html>
<html>
    <head>
        <title>Led Controller</title>
        <link rel="icon" href="favicon.svg" sizes="any" type="image/svg+xml">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/core-js/3.39.0/minified.js" integrity="sha512-qc8tnhnrlWqffX6ObbRcniCPRG9xwBKf4n0h4Bs9jMyTEz1i6X+rhd2+GMGP7sIDjNnghryql3CYXLYb3XcdhA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="https://cdn.jsdelivr.net/npm/@jaames/iro@5"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body data-bs-theme="dark">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);" class="justify-content-center">
            <div id="picker"></div>
            <button onclick="getDev()" id="control-button" class="btn btn-success" style="margin-top: 10px; margin-bottom: 10px; position: relative; left: 50%; transform: translateX(-50%);">Connect</button>
            <br>
            <textarea class="form-control" id="out" style="position: relative; left: 50%; transform: translateX(-50%); width: 320px; height: 150px;" readonly></textarea>
        </div>
        <script type="text/javascript">
            var characteristic = null;
            var localdevice = null;

            function log(text) {
                document.getElementById("out").value += text + "\n";
            }
            let options = {
                filters: [{
                    services: [0xFFF0]
                }, {
                    namePrefix: "ELK-BLEDOM"
                }]
            };

            function getDev() {
                log("Searching for ELK-BLEDOM with service 0xFFF0");
                navigator.bluetooth.requestDevice(options).then(device => {
                    log("Connecting to device...");
                    try {
                        localdevice = device;
                        device.addEventListener("gattserverdisconnected", onDisconnected);
                        return device.gatt.connect();
                    } catch (exc) {
                        log(exc)
                    };
                }).then(server => {
                    log("Getting primary service...");
                    try {
                        return server.getPrimaryService(0xFFF0);
                    } catch (exc) {
                        log(exc + "\nError in getting primary service")
                    };
                }).then(service => {
                    log("Getting service characteristic...");
                    try {
                        return service.getCharacteristic(0xFFF3);
                    } catch (exc) {
                        log(exc + "\nError in getting service characteristic")
                    };
                }).then(bcharacteristic => {
                    characteristic = bcharacteristic;
                    log("Connected!")
                    let btn = document.getElementById("control-button");
                    btn.className = "btn btn-danger";
                    btn.innerText = "Disconnect";
                    btn.onclick = disconnect;
                });
            }

            function onDisconnected(event) {
                let device = event.target;
                log("Device " + device.name + " is disconnected");
                localdevice = null;
                characteristic = null;
                let btn = document.getElementById("control-button");
                btn.className = "btn btn-success";
                btn.innerText = "Connect";
                btn.onclick = getDev;
            }

            function disconnect() {
                if (localdevice != null) {
                  localdevice.gatt.disconnect();
                  localdevice = null;
                  characteristic = null;
                  let btn = document.getElementById("control-button");
                  btn.className = "btn btn-success";
                  btn.innerText = "Connect";
                  btn.onclick = getDev;
                }
            }

            var colorPicker = new iro.ColorPicker("#picker", {
                width: 320,
                color: "#ffffff"
            });

            colorPicker.on("color:change", function(color) {
                // Set color command
                let colorCommand = Uint8Array.fromHex("7e070503" + color.hexString.substring(1) + "00ef");
                // Send color command
                if (characteristic != null) characteristic.writeValue(colorCommand);
            });
        </script>
    </body>
</html>
